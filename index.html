/* VOICE: a quiet garment-tech studio, tools first, no fuss
   IDEA: a cutting table beside a fitting mannequin — flat pieces left, worn shirt right
   PICTURE: the live 3D shirt and the flat pattern sheet are the page
   COLOUR and TYPE: graphite workshop ground, chalk ink, tailor's-chalk coral accent; Inter Tight + Inter
   LAYOUT: controls strip, then sheet | shirt side by side; stacked shirt-first on phones */
:root{color-scheme:dark;--bg:#151617;--panel:#1f2123;--panel2:#26292c;--line:#34373b;--ink:#eceae5;--mute:#9b9da1;--acc:#2563eb;--ph-y:#ffd500;--ph-b:#1f63e6;--ph-r:#e8163c}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
header{padding:14px max(3vw,14px) 4px;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
h1{font:700 28px/1.05 'Inter Tight',Inter,sans-serif;margin:0}
header p{margin:0;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px max(3vw,14px)}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.grp[hidden]{display:none}.seg{display:inline-flex;gap:0}.seg .chip{border-radius:0;margin-left:-1px}.seg .chip:first-child{border-radius:10px 0 0 10px;margin-left:0}.seg .chip:last-child{border-radius:0 10px 10px 0}.seg .chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;position:relative}
.lbl{font-size:13px;color:var(--mute);margin-right:2px}
button,.btn,select,input[type=text],input[type=number]{font:inherit;font-size:14px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 12px}
button,.btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
input[type=text],input[type=number]{font-size:16px;width:100%}
select{font-size:15px;cursor:pointer}
button:hover,.btn:hover{border-color:#5a5e63}
button:disabled{opacity:.45;cursor:default}button:disabled:hover{border-color:var(--line)}
:is(button,.btn,select,input):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.primary:hover{background:#3b74f0;border-color:#7fb0ff}
.sw{width:32px;height:32px;min-height:0;padding:0;border-radius:50%;border:2px solid #0006;flex:none}
.sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.pat{width:40px;height:40px;min-height:0;padding:0;background-size:cover;border-radius:8px}
input[type=color]{width:40px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}
input[type=range]{accent-color:var(--acc);width:100%}
.top{padding:4px 0 0;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}.top{position:sticky;top:0;z-index:40;margin:0 max(2vw,12px);border-top-left-radius:0;border-top-right-radius:0;border-top:0;overflow:hidden;background:rgba(24,25,27,.86);border:1px solid var(--line);border-radius:14px;padding:10px 170px 10px 16px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.top::after{content:'';position:absolute;top:0;bottom:0;right:-30px;width:190px;pointer-events:none;background:linear-gradient(116deg,transparent 0 22%,#2b2d31 22.5% 38%,var(--ph-y) 38.5% 54%,var(--ph-b) 54.5% 70%,var(--ph-r) 70.5% 86%,transparent 86.5%)}
.top .acts{position:relative;z-index:1}
.top .tag{margin:0;flex:1 1 300px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 0}
.ttl,.steps{display:flex;align-items:center;border-left:1px solid #4a4d52;padding:2px 16px;min-height:34px}
.ttl{gap:10px;font:600 22px/1.1 'Outfit','Inter Tight',Inter,sans-serif;color:#fff;letter-spacing:.015em;white-space:nowrap}.ttl em{font-style:normal;color:var(--ph-y)}.ttx{display:inline-block;line-height:1;padding-top:2px}
.steps{gap:10px 12px;flex-wrap:wrap;font-size:14px;color:#e6e4df}.steps>span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.steps i{width:5px;height:5px;border-radius:50%;background:var(--ph-y);flex:none}
.top .tag svg{width:24px;height:24px;fill:none;stroke:var(--ph-y);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.top .tag .tsh{width:30px;height:30px;stroke:#fff}.top .tag .tsh .py{stroke:var(--ph-y)}
@media(max-width:899px){.top{position:relative;border-radius:0 0 14px 14px}}@media(max-width:620px){.top{padding:10px 70px 10px 12px}.top::after{width:96px;right:-34px}.ttl,.steps{border-left:0;padding:2px 0}.ttl{font-size:19px}.steps{font-size:13px;gap:4px 14px}.steps i{display:none}.top .acts{margin-left:0}}
/* soft flag-colour sweep behind the workspace (grey, yellow, blue, red), from the PHabrika logo */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(118deg,transparent 0 22%,rgba(255,255,255,.06) 22.2% 28%,rgba(255,213,0,.28) 28.2% 33%,rgba(15,91,216,.32) 33.2% 38%,rgba(232,22,60,.28) 38.2% 43%,transparent 43.2%),
  linear-gradient(118deg,transparent 0 84%,rgba(255,255,255,.05) 84.2% 87%,rgba(255,213,0,.16) 87.2% 90%,rgba(15,91,216,.18) 90.2% 93%,rgba(232,22,60,.16) 93.2% 96%,transparent 96.2%),
  radial-gradient(120% 80% at 50% 0%,#24262a 0,transparent 70%)}.acts{display:flex;gap:8px;margin-left:auto}.acts .primary{border:2px solid transparent;background:linear-gradient(var(--acc),var(--acc)) padding-box,linear-gradient(100deg,var(--ph-y) 0 33%,var(--ph-b) 33% 66%,var(--ph-r) 66%) border-box}.acts .primary:hover{background:linear-gradient(#3b74f0,#3b74f0) padding-box,linear-gradient(100deg,var(--ph-y) 0 33%,var(--ph-b) 33% 66%,var(--ph-r) 66%) border-box}
.work{--pv:var(--pvw,clamp(340px,42vw,860px));display:grid;grid-template-columns:minmax(0,1fr) 14px var(--pv);align-items:start;padding:10px max(2vw,12px) 16px}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin:0 0 10px}.bhead h2{font:600 17px/1.2 'Inter Tight',Inter;margin:0}
.gfields{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}.gfields+.gfields{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.split{align-self:stretch;cursor:col-resize;position:relative;touch-action:none;outline:0}.split::after{content:'';position:sticky;top:45vh;display:block;margin:45vh auto 0;width:4px;height:56px;border-radius:2px;background:var(--line)}.split:hover::after,.split:focus-visible::after{background:var(--acc)}
.pane.view{position:sticky;top:calc(var(--hh,64px) + 10px);height:calc(100vh - var(--hh,64px) - 20px);height:calc(100dvh - var(--hh,64px) - 20px);min-height:460px;max-height:1200px}
.pane.view.full,.pane.view:fullscreen{position:fixed;inset:0;z-index:70;height:auto;max-height:none;border-radius:0}.pane.view:fullscreen{position:static;height:100vh}
#stage.tp{background:repeating-conic-gradient(#2c2e31 0 25%,#232528 0 50%) 0 0/20px 20px}
.box{position:relative}.box::after,.pane::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:6;opacity:.5;background:linear-gradient(315deg,transparent 0 9px,#e8163c 9px 15px,#1f63e6 15px 21px,#ffd500 21px 27px,transparent 27px) right bottom/46px 46px no-repeat}
.bgctl{position:absolute;top:10px;right:10px;z-index:8;display:flex;flex-direction:column;align-items:flex-end;gap:6px}.pane .bgbtn{min-height:32px;min-width:32px;padding:0;display:grid;place-items:center;border-radius:9px;background:rgba(20,21,23,.45);border:1px solid rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer}.bgbtn svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.bgbtn svg .f{fill:#fff;stroke:none}.pane .bgbtn[aria-expanded=true]{border-color:var(--ph-y)}.bgmenu{min-width:150px;max-height:min(60vh,360px);overflow:auto;padding:6px;border-radius:12px;background:rgba(20,21,23,.5);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.bgmenu[hidden]{display:none}.pane .bgmenu button{display:block;width:100%;min-height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:#fff;font:500 12px Inter,sans-serif;text-align:left;cursor:pointer}.pane .bgmenu button:hover{background:rgba(255,255,255,.12)}.pane .bgmenu button[aria-pressed=true]{background:rgba(255,213,0,.22)}.bgh{padding:6px 10px 2px;font:600 10.5px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6)}.bgx{display:flex;gap:6px;align-items:center;padding:4px 4px 0}.sheet{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#1b1c1e}
.etools{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 8px}.tg{display:flex;gap:4px;align-items:center}
.ib{min-height:36px;min-width:36px;padding:0 7px;justify-content:center}.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib[aria-pressed=true]{border-color:var(--acc);color:#fff;background:#16284a}.ib[aria-pressed=false]{color:var(--mute)}.ib.sel[aria-pressed=false]{color:var(--ink)}
.zl{font-size:12px;min-width:42px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.dgrid{display:grid;grid-template-columns:minmax(230px,290px) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.layers{border:1px solid var(--line);border-radius:12px;background:#1a1b1d;display:flex;flex-direction:column;max-height:460px;min-height:180px}

<main class="work" id="work">
 <div class="left">

  <section class="box" aria-labelledby="hG">
   <div class="bhead"><h2 id="hG">Garment</h2></div>
   <div class="gfields">
    <div class="grp"><label class="lbl" for="style">Style</label>
     <select id="style"><option value="tee">T-shirt Male</option><option value="wtee">T-shirt Female</option><option value="polo">Polo shirt Male</option><option value="wpolo">Polo shirt Female</option><option value="vjersey">V-neck Jersey Male</option><option value="wvjersey">V-neck Jersey Female</option><option value="bjersey">Basketball Jersey</option></select></div>
    <div class="grp"><label class="lbl" for="size">Size</label><select id="size"><option value="kids">Kids</option><option>XS</option><option>S</option><option>M</option><option selected>L</option><option>XL</option><option>XXL</option><option>XXXL</option></select></div>
    <div class="grp" id="fabGrp"><label class="lbl" for="fab">Fabric</label><select id="fab"><option value="cotton" selected>Cotton</option><option value="poly">Polyester</option><option value="drifit">Dri-FIT</option></select><p class="fabinfo" id="fabInfo" aria-live="polite"></p></div>
    <div class="grp" id="slenGrp"><label class="lbl" for="slen">Sleeve</label><input type="range" id="slen" min="8" max="62" step="1" value="24" style="width:140px"><span class="lbl" id="slenv">24 cm</span></div>
    <div class="grp" id="neckGrp" hidden><span class="lbl" id="neckLbl">Neckline</span><span class="seg" role="group" aria-labelledby="neckLbl"><button class="chip" data-neck="round" aria-pressed="false">Round Neck</button><button class="chip" data-neck="v" aria-pressed="true">V-Neck</button></span></div>
    <div class="grp" id="strapGrp" hidden><label class="lbl" for="strapw">Shoulder strap</label><input type="range" id="strapw" min="0.5" max="2.5" step="0.05" value="1" style="width:150px"><span class="lbl" id="strapv">1.00× · 5.0 cm</span></div>
   </div>
   <div class="gfields">
    <div class="grp cgrp"><span class="lbl" title="The colour of the whole shirt">Shirt colour</span><span class="grp" id="colors"></span><input type="color" id="gcol" aria-label="Custom shirt colour"></div>
    <div class="grp"><span class="lbl">Collar, hem &amp; cuffs</span><label class="lbl trimlbl" style="display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--ink)"><input type="checkbox" id="trimOn"> Different colour</label><input type="color" id="trim" value="#f2f1ec" aria-label="Colour for collar, hem and cuffs" title="Collar, hem and cuffs"></div>
   </div>
   <div class="gal" id="gal">
    <div class="galhead"><span class="lbl">Colour, pattern &amp; design</span></div>
    <div class="galrow" role="group" aria-label="Where to put it"><span class="lbl">Put it on</span><button type="button" class="chip" data-to="all" aria-pressed="true">Whole shirt</button><button type="button" class="chip" data-to="front" aria-pressed="false">Front</button><button type="button" class="chip" data-to="back" aria-pressed="false">Back</button><button type="button" class="chip" data-to="sleeves" aria-pressed="false">Sleeves</button></div>
    <div class="gtiles" id="gtiles" role="group" aria-label="Pick a colour, pattern or design"></div>
    <button type="button" class="chip galmore" id="galMore" aria-expanded="false">Show sample pattern list</button>
    <p class="galmsg" id="galMsg" aria-live="polite" hidden></p>
   </div>
  </section>

  <section class="box" aria-labelledby="hD">
   <div class="bhead"><h2 id="hD">Design</h2>
    <div class="grp"><label class="btn primary">Add image<input type="file" id="file" accept="image/*" multiple hidden></label>
     <button id="addText">Add text</button><button id="addName" title="Player name on the upper back">Add name</button><button id="addNum" title="Jersey number on the back">Add number</button>
     <button id="undo" title="Undo (Ctrl+Z)">Undo</button><button id="clearAll" title="Remove all artwork (Undo brings it back)" disabled>Clear all</button></div>

 if(b.sleeve)g.sleeve={...b.sleeve,w0:+(b.sleeve.w0*sx).toFixed(1),w1:+(b.sleeve.w1*sx).toFixed(1),l:+(b.sleeve.l*(sx+sy)/2).toFixed(1)};return g}

function layout(){
 G=sizeSpec();const sl=G.sleeve||ST.tee.sleeve;RX=G.W*.395;RZ=RX*.55;
 F.x=2;F.y=2;F.w=G.W;F.h=G.H;B.x=G.W+2;B.y=2;B.w=G.W;B.h=G.H;
 RS.w=LS.w=sl.w0;RS.h=LS.h=sl.l;RS.x=2+(G.W-sl.w0)/2;LS.x=B.x+(G.W-sl.w0)/2;RS.y=LS.y=G.H+12;

 TH=[];AL=[];let L=0,px=0,pz=0;
 for(let i=0;i<=400;i++){const th=-PI/2+PI*i/400,x=RX*Math.sin(th),z=RZ*Math.cos(th);if(i)L+=Math.hypot(x-px,z-pz);TH.push(th);AL.push(L);px=x;pz=z}

}

 geo:{name:'Geometric',tile:22,make(){const c=mkp(512),x=c.getContext('2d'),r=rng(7),P=['#e2654b','#e0a03a','#efe3cc'];x.fillStyle='#1d1b19';x.fillRect(0,0,512,512);const s=64;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){const X=i*s,Y=j*s,k=r()*4|0,col=P[r()*3|0],pts=[[X+3,Y+3],[X+s-3,Y+3],[X+s-3,Y+s-3],[X+3,Y+s-3]];pts.splice(k,1);x.beginPath();pts.forEach((p,m)=>m?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();const q=r();

};
const thumbOf=c=>{const t=mk(80),s=Math.min(c.width,c.height);t.getContext('2d').drawImage(c,(c.width-s)/2,(c.height-s)/2,s,s,0,0,80,80);return t.toDataURL()};

/* ---------- solid colour + shaped geometric designs (redrawn from their colours; hex editable) ---------- */
const SHAPES={
 solid:{name:'Solid colour',two:false,c:['#c8202f'],d(x,w,h,a){x.fillStyle=a;x.fillRect(0,0,w,h)}},
};
// ---------- Pattern library (drawn in cm, sharp at any print size) ----------
const hx2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mixc=(a,b,t)=>{const p=hx2(a),q=hx2(b);return'#'+p.map((v,i)=>Math.round(v+(q[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const PPC=['#14284b','#8e9bb5','#ffffff'];
const PP={
 diag:{name:'01 · Diagonal stripes',d(x,W,H,s,[A,B,C],r){x.fillStyle=C;x.fillRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.rotate(-35*PI/180);const R=Math.hypot(W,H);let p=-R/2;
  while(p<R/2){const w=(1.2+r()*6.5)*s,k=r();x.fillStyle=k<.4?A:k<.62?B:k<.72?mixc(A,C,.3):k<.8?mixc(B,C,.5):C;x.fillRect(p,-R/2,w+1,R);if(r()<.3){x.fillStyle=k<.5?C:A;x.fillRect(p+w*.2,-R/2,.22*s,R)}p+=w}
  for(let i=0;i<18;i++){const px=(r()-.5)*R,py=(r()-.5)*R,l=(10+r()*18)*s,wd=(.7+r()*1.5)*s;x.fillStyle=r()<.5?A:C;x.beginPath();x.moveTo(px,py);x.lineTo(px+wd,py);x.lineTo(px+wd*.5,py+l);x.closePath();x.fill()}x.restore()}},
 hex:{name:'02 · Hexagon honeycomb',d(x,W,H,s,[A,B,C],r){x.fillStyle=C;x.fillRect(0,0,W,H);const R=3.1*s,g=.3*s,dx=R*Math.sqrt(3),dy=R*1.5;
  for(let j=-1;j*dy<H+R;j++)for(let i=-1;i*dx<W+dx;i++){const cx=i*dx+(j&1?dx/2:0),cy=j*dy,t=Math.min(1,Math.max(0,cy/H*1.3-.2+(r()-.5)*.22));
   x.fillStyle=t<.35?mixc(C,B,t/.35*.55):t<.7?mixc(mixc(C,B,.55),A,(t-.35)/.35*.75):mixc(mixc(B,A,.75),A,(t-.7)/.3);x.beginPath();for(let k=0;k<6;k++){const a=PI/6+k*PI/3,q=R-g/2;x.lineTo(cx+q*Math.cos(a),cy+q*Math.sin(a))}x.closePath();x.fill()}}},
 tri:{name:'03 · Triangle tessellation',d(x,W,H,s,[A,B,C],r){const S=7*s,h=S*Math.sqrt(3)/2,cols=[A,mixc(A,B,.5),B,mixc(B,C,.5),C];

  const tri=(a,b,c)=>{x.fillStyle=cols[r()*cols.length|0];x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(c[0],c[1]);x.closePath();x.fill();x.strokeStyle=x.fillStyle;x.lineWidth=1.2;x.stroke()};
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){const a=P[j][i],b=P[j][i+1],c=P[j+1][i],d=P[j+1][i+1];if(r()<.5){tri(a,b,d);tri(a,d,c)}else{tri(a,b,c);tri(b,d,c)}}}},
 cube:{name:'06 · Cube / isometric',d(x,W,H,s,[A,B,C]){const S=6*s,dx=S*Math.sqrt(3),dy=1.5*S,hw=dx/2;
